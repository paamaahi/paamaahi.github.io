<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paamaahi | پاماهی</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --neon-blue: #00f0ff;
            --glass-bg: rgba(5, 10, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --font-fa: 'Vazirmatn', sans-serif;
            --font-en: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: var(--font-fa);
            color: var(--text-main);
            cursor: crosshair;
            transition: font-family 0.3s;
        }

        #lang-toggle {
            position: fixed; bottom: 30px; left: 30px; z-index: 100; cursor: pointer;
            font-family: var(--font-en); font-size: 1.1rem; letter-spacing: 2px;
            color: #fff; text-shadow: 0 0 10px var(--neon-blue);
            border: 1px solid rgba(0, 240, 255, 0.4); padding: 5px 12px;
            border-radius: 4px; background: rgba(0,0,0,0.5); transition: all 0.3s;
        }
        #lang-toggle:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 15px var(--neon-blue); }
        html[dir="ltr"] #lang-toggle { left: auto; right: 30px; }

        /* Intro Redesign: Atmospheric Moon, Branch & Fluid Tape */
        #intro {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #020408; cursor: pointer;
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 2s ease;
            overflow: hidden;
        }
        
        /* Starry background subtle effect */
        .intro-stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: 1;
        }

        /* Textured Moon */
        .intro-moon {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 220px; height: 220px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, transparent 40%, rgba(0,0,0,0.4) 80%),
                radial-gradient(circle at 60% 70%, rgba(0,0,0,0.3) 10%, transparent 30%),
                radial-gradient(circle at 25% 65%, rgba(0,0,0,0.2) 15%, transparent 35%),
                radial-gradient(circle at 75% 40%, rgba(0,0,0,0.15) 20%, transparent 45%),
                #e0e6ed;
            box-shadow: 
                0 0 100px 30px rgba(180, 220, 255, 0.2), 
                inset -20px -20px 50px rgba(0,0,0,0.8),
                inset 10px 10px 20px rgba(255,255,255,0.8);
            z-index: 2;
            transition: all 0.5s ease;
            filter: contrast(1.1) drop-shadow(0 0 15px rgba(255,255,255,0.4));
        }
        
        #intro:hover .intro-moon {
            box-shadow: 
                0 0 120px 40px rgba(180, 220, 255, 0.4), 
                inset -20px -20px 50px rgba(0,0,0,0.8),
                inset 10px 10px 20px rgba(255,255,255,0.9);
            filter: contrast(1.2) drop-shadow(0 0 25px rgba(255,255,255,0.6));
        }

        /* Branch Silhouette crossing the moon */
        .intro-branch {
            position: absolute;
            top: 15%;
            left: 55%;
            width: 350px;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><path d="M200 0 Q150 10 100 30 T20 60 Q30 40 100 20 Q160 5 200 -10 Z" fill="black"/><path d="M120 25 Q90 50 60 70 Q75 60 110 35 Z" fill="black"/><path d="M80 45 Q60 80 40 95 Q65 75 85 45 Z" fill="black"/></svg>') no-repeat;
            background-size: contain;
            transform: rotate(15deg);
            z-index: 3;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
            pointer-events: none;
        }

        /* Fluid SVG Tape */
        .intro-tape-container {
            position: absolute;
            top: 40%;
            left: 52%;
            width: 40px;
            height: 300px;
            z-index: 4;
            pointer-events: none;
        }

        .fluid-tape {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #0a0a0a;
            stroke-width: 6;
            stroke-linecap: round;
            filter: drop-shadow(2px 0px 1px rgba(255,255,255,0.4)) drop-shadow(-1px 0px 2px rgba(0, 240, 255, 0.2));
            animation: fluidSwing 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
            transform-origin: top center;
        }

        @keyframes fluidSwing {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(5deg) scaleY(1.02); }
            100% { transform: rotate(-3deg); }
        }

        .tape-path {
            animation: waveMotion 4s ease-in-out infinite alternate;
        }

        @keyframes waveMotion {
            0% { d: path("M20,0 C35,50 5,100 20,150 C35,200 5,250 20,300"); }
            50% { d: path("M20,0 C5,50 35,100 20,150 C5,200 35,250 20,300"); }
            100% { d: path("M20,0 C25,50 15,100 20,150 C25,200 15,250 20,300"); }
        }

        .intro-text { 
            position: absolute; bottom: 20%; font-size: 1.2rem; font-weight: 300; text-align: center; 
            opacity: 0.9; max-width: 600px; line-height: 2; z-index: 5; 
            text-shadow: 0 0 15px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,1); 
        }

        .click-start {
            position: absolute; bottom: 10%; font-family: var(--font-en); 
            font-size: 1rem; letter-spacing: 3px; color: var(--neon-blue); 
            z-index: 5; animation: pulseText 2s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; text-shadow: 0 0 10px var(--neon-blue); } }

        #main-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 2s ease 0.5s; }
        #main-content.visible { opacity: 1; pointer-events: auto; }

        #bg-video {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            min-width: 100%; min-height: 100%; z-index: 0; object-fit: cover;
            opacity: 0.5; filter: brightness(110%);
        }

        .water-overlay { position: fixed; bottom: 0; left: 0; width: 100%; height: 35vh; z-index: 1; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(2, 10, 20, 0.8) 100%); backdrop-filter: blur(4px); }
        .water-overlay::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.05) 3px, transparent 4px); animation: waterRipples 6s linear infinite; mix-blend-mode: overlay; }
